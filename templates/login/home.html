<!DOCTYPE html>
<html>
<head>
    <title>首页</title>
    <meta charset="utf-8">
    <style>
        .test-area {
            border: 1px solid #ddd;
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h2>欢迎, {{ user.username }}</h2>
    <a href="{% url 'login_app:login' %}">退出</a>
    <hr>

    <!-- 原有水果分类测试区域 -->
    <div class="test-area">
        <h3>1. 水果分类测试</h3>
        <form id="fruit-form" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="image" accept="image/*" required>
            <button type="submit">上传并预测</button>
        </form>
        <div id="fruit-result" class="result">
            等待预测结果...
        </div>
    </div>

    <!-- 新接口1：自动检测熟度 -->
    <div class="test-area">
        <h3>2. 自动检测熟度（仅芒果/香蕉/草莓）</h3>
        <form id="ripeness-auto-form" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="image" accept="image/*" required>
            <button type="submit">上传并检测熟度</button>
        </form>
        <div id="ripeness-auto-result" class="result">
            等待检测结果...
        </div>
    </div>

    <!-- 新接口2：指定水果类型检测熟度 -->
    <div class="test-area">
        <h3>3. 指定水果类型检测熟度</h3>
        <form id="ripeness-type-form" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="image" accept="image/*" required>
            <select name="type">
                <option value="mango">芒果</option>
                <option value="banana">香蕉</option>
                <option value="strawberry">草莓</option>
            </select>
            <button type="submit">上传并检测熟度</button>
        </form>
        <div id="ripeness-type-result" class="result">
            等待检测结果...
        </div>
    </div>

    <script>
        // 通用 CSRF token 获取
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        // 原有水果分类
        document.getElementById('fruit-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var formData = new FormData(this);
            fetch('/login/predict/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': csrftoken,
                },
            })
            .then(response => response.json())
            .then(data => {
                var resultDiv = document.getElementById('fruit-result');
                if (data.predicted_class && data.confidence !== undefined) {
                    resultDiv.innerHTML = `<strong>预测结果：</strong> ${data.predicted_class}<br><strong>置信度：</strong> ${(data.confidence * 100).toFixed(2)}%`;
                } else if (data.error) {
                    resultDiv.innerHTML = `<strong>错误：</strong> ${data.error}`;
                } else {
                    resultDiv.innerHTML = '<strong>错误：</strong> 未知错误';
                }
            })
            .catch(error => {
                document.getElementById('fruit-result').innerHTML = `<strong>请求失败：</strong> ${error}`;
            });
        });

        // 新接口1：自动检测熟度
        document.getElementById('ripeness-auto-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var formData = new FormData(this);
            fetch('/login/predict_with_ripeness/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': csrftoken,
                },
            })
            .then(response => response.json())
            .then(data => {
                var resultDiv = document.getElementById('ripeness-auto-result');
                if (data.status === 'success') {
                    if (data.ripeness_result) {
                        // 有熟度结果
                        let probHtml = '';
                        for (let [cls, prob] of Object.entries(data.ripeness_result.probabilities)) {
                            probHtml += `<li>${cls}: ${(prob * 100).toFixed(2)}%</li>`;
                        }
                        resultDiv.innerHTML = `
                            <strong>识别水果：</strong> ${data.fruit_type}<br>
                            <strong>熟度判定：</strong> ${data.ripeness_result.predicted_class}<br>
                            <strong>综合置信度：</strong> ${(data.ripeness_result.confidence * 100).toFixed(2)}%<br>
                            <strong>各类概率明细：</strong><ul>${probHtml}</ul>
                        `;
                    } else {
                        // 非目标水果
                        resultDiv.innerHTML = `
                            <strong>识别水果：</strong> ${data.fruit_type}<br>
                            <strong>信息：</strong> ${data.message}<br>
                            <strong>水果分类置信度：</strong> ${(data.confidence * 100).toFixed(2)}%
                        `;
                    }
                } else {
                    resultDiv.innerHTML = `<strong>错误：</strong> ${data.error || '未知错误'}`;
                }
            })
            .catch(error => {
                document.getElementById('ripeness-auto-result').innerHTML = `<strong>请求失败：</strong> ${error}`;
            });
        });

        // 新接口2：指定类型检测熟度
        document.getElementById('ripeness-type-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var formData = new FormData(this);
            fetch('/login/predict_ripeness_by_type/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': csrftoken,
                },
            })
            .then(response => response.json())
            .then(data => {
                var resultDiv = document.getElementById('ripeness-type-result');
                if (data.status === 'success' && data.ripeness_result) {
                    let probHtml = '';
                    for (let [cls, prob] of Object.entries(data.ripeness_result.probabilities)) {
                        probHtml += `<li>${cls}: ${(prob * 100).toFixed(2)}%</li>`;
                    }
                    resultDiv.innerHTML = `
                        <strong>指定水果类型：</strong> ${data.fruit_type}<br>
                        <strong>熟度判定：</strong> ${data.ripeness_result.predicted_class}<br>
                        <strong>综合置信度：</strong> ${(data.ripeness_result.confidence * 100).toFixed(2)}%<br>
                        <strong>各类概率明细：</strong><ul>${probHtml}</ul>
                    `;
                } else {
                    resultDiv.innerHTML = `<strong>错误：</strong> ${data.error || '未知错误'}`;
                }
            })
            .catch(error => {
                document.getElementById('ripeness-type-result').innerHTML = `<strong>请求失败：</strong> ${error}`;
            });
        });
    </script>
</body>
</html>
