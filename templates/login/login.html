<!DOCTYPE html>
<html>
<head>
    <title>登录</title>
</head>
<body>
    <h2>用户登录</h2>
    {% if messages %}
        {% for message in messages %}
            <p style="color:red;">{{ message }}</p>
        {% endfor %}
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">登录</button>
    </form>
</body>
</html>
