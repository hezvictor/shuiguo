<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果智能检测系统 - 登录/注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 16px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab.active {
            color: #667eea;
            background: white;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #667eea;
        }

        .form-container {
            padding: 40px 30px;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
            font-style: normal;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #6c757d;
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 30px 20px;
            }
            .tab {
                font-size: 16px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="tabs">
        <div class="tab active" data-tab="login">登录</div>
        <div class="tab" data-tab="register">注册</div>
    </div>
    <div class="form-container">
        <!-- 登录表单 -->
        <div id="login-form" class="form active">
            <div class="input-group">
                <i>👤</i>
                <input type="text" id="login-username" placeholder="用户名" autocomplete="username">
            </div>
            <div class="input-group">
                <i>🔒</i>
                <input type="password" id="login-password" placeholder="密码" autocomplete="current-password">
            </div>
            <button class="btn" id="login-btn">登 录</button>
            <div id="login-message" class="message"></div>
        </div>

        <!-- 注册表单 -->
        <div id="register-form" class="form">
            <div class="input-group">
                <i>👤</i>
                <input type="text" id="reg-username" placeholder="用户名" autocomplete="username">
            </div>
            <div class="input-group">
                <i>📧</i>
                <input type="email" id="reg-email" placeholder="邮箱（可选）" autocomplete="email">
            </div>
            <div class="input-group">
                <i>🔒</i>
                <input type="password" id="reg-password" placeholder="密码" autocomplete="new-password">
            </div>
            <div class="input-group">
                <i>🔒</i>
                <input type="password" id="reg-confirm" placeholder="确认密码" autocomplete="off">
            </div>
            <button class="btn" id="register-btn">注 册</button>
            <div id="register-message" class="message"></div>
        </div>
        <div class="footer-note">
            <span>🍎 智能水果检测系统</span>
        </div>
    </div>
</div>

<script>
    // 获取CSRF Token
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    // 选项卡切换
    const tabs = document.querySelectorAll('.tab');
    const forms = {
        login: document.getElementById('login-form'),
        register: document.getElementById('register-form')
    };

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            const target = tab.getAttribute('data-tab');
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            Object.values(forms).forEach(form => form.classList.remove('active'));
            forms[target].classList.add('active');
            // 清空消息
            document.querySelectorAll('.message').forEach(msg => {
                msg.className = 'message';
                msg.style.display = 'none';
            });
        });
    });

    // 显示消息
    function showMessage(element, text, type) {
        element.textContent = text;
        element.className = `message ${type}`;
        element.style.display = 'block';
        setTimeout(() => {
            element.style.display = 'none';
        }, 3000);
    }

    // 登录逻辑
    document.getElementById('login-btn').addEventListener('click', async () => {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        const messageDiv = document.getElementById('login-message');

        if (!username || !password) {
            showMessage(messageDiv, '请填写用户名和密码', 'error');
            return;
        }

        try {
            const response = await fetch('/api/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken,
                },
                credentials: 'include',
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();
            if (response.ok && data.status === 'success') {
                showMessage(messageDiv, '登录成功，正在跳转...', 'success');
                setTimeout(() => {
                    window.location.href = '/home/';
                }, 1000);
            } else {
                showMessage(messageDiv, data.error || '登录失败，请检查用户名和密码', 'error');
            }
        } catch (error) {
            showMessage(messageDiv, '网络错误，请稍后重试', 'error');
        }
    });

    // 注册逻辑
    document.getElementById('register-btn').addEventListener('click', async () => {
        const username = document.getElementById('reg-username').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirm = document.getElementById('reg-confirm').value;
        const messageDiv = document.getElementById('register-message');

        if (!username || !password) {
            showMessage(messageDiv, '请填写用户名和密码', 'error');
            return;
        }
        if (password !== confirm) {
            showMessage(messageDiv, '两次输入的密码不一致', 'error');
            return;
        }
        if (password.length < 6) {
            showMessage(messageDiv, '密码长度至少6位', 'error');
            return;
        }

        try {
            const response = await fetch('/api/register/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken,
                },
                credentials: 'include',
                body: JSON.stringify({ username, password, email })
            });
            const data = await response.json();
            if (response.ok && data.status === 'success') {
                showMessage(messageDiv, '注册成功，正在跳转...', 'success');
                setTimeout(() => {
                    window.location.href = '/home/';
                }, 1000);
            } else {
                showMessage(messageDiv, data.error || '注册失败', 'error');
            }
        } catch (error) {
            showMessage(messageDiv, '网络错误，请稍后重试', 'error');
        }
    });
</script>
</body>
</html>
